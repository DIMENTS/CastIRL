[versions]
agp                = "8.6.1"
kotlin             = "2.0.21"
ksp                = "2.0.21-1.0.27"
hilt               = "2.57"
compose-bom        = "2025.05.00"
activity-compose   = "1.9.3"
lifecycle          = "2.8.7"
navigation-compose = "2.8.5"
datastore          = "1.1.1"
coroutines         = "1.9.0"
core-ktx           = "1.15.0"
serialization-json = "1.9.0"
material3          = "1.4.0-alpha14"
rootencoder        = "2.7.0"

[libraries]
# Compose
compose-bom                    = { group = "androidx.compose", name = "compose-bom",            version.ref = "compose-bom" }
compose-ui                     = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3              = { group = "androidx.compose.material3", name = "material3",    version.ref = "material3" }

# Activity + Lifecycle
activity-compose               = { group = "androidx.activity",   name = "activity-compose",             version.ref = "activity-compose" }
lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
lifecycle-runtime-compose      = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }
lifecycle-service              = { group = "androidx.lifecycle",  name = "lifecycle-service",            version.ref = "lifecycle" }

# Navigation
navigation-compose             = { group = "androidx.navigation", name = "navigation-compose",  version.ref = "navigation-compose" }

# Hilt
hilt-android                   = { group = "com.google.dagger",   name = "hilt-android",        version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",   name = "hilt-compiler",       version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",       name = "hilt-navigation-compose", version = "1.2.0" }

# DataStore
datastore-preferences          = { group = "androidx.datastore",  name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json     = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }

# Core
core-ktx                       = { group = "androidx.core",       name = "core-ktx",            version.ref = "core-ktx" }
core-splashscreen              = { group = "androidx.core",       name = "core-splashscreen",   version = "1.0.1" }

# RootEncoder
rootencoder-library            = { group = "com.github.pedroSG94.RootEncoder", name = "library", version.ref = "rootencoder" }

[plugins]
android-application    = { id = "com.android.application",                    version.ref = "agp"    }
kotlin-android         = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                   = { id = "com.google.dagger.hilt.android",             version.ref = "hilt"   }
ksp                    = { id = "com.google.devtools.ksp",                    version.ref = "ksp"    }
